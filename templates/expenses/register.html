{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — ExpenseIQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link href="{% static 'css/main.css' %}" rel="stylesheet"/>
  <style>
    body { background: var(--bg); display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .login-card { width:100%; max-width:420px; }
  </style>
</head>
<body>
<div class="login-card">
  <div class="card-box">
    <div class="text-center mb-4">
      <div style="font-size:2.5rem; color:var(--accent)"><i class="bi bi-wallet2"></i></div>
      <h4 class="fw-bold mt-2 mb-0">Create Your Flat</h4>
      <p class="text-muted small">Set up ExpenseIQ for your household</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small">{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Flat / Household Name</label>
        <input type="text" name="flat_name" class="form-control" placeholder="e.g. Sunrise Apartment" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Your Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="e.g. Rahul Sharma" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="e.g. rahul123" required/>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required/>
      </div>
      <div class="mb-4">
        <label class="form-label">Confirm Password</label>
        <input type="password" name="password2" class="form-control" required/>
      </div>
      <button type="submit" class="btn btn-accent w-100">
        <i class="bi bi-house-add me-2"></i>Create Account
      </button>
    </form>
    <p class="text-center text-muted small mt-3">
      Already have an account? <a href="{% url 'login' %}">Sign in</a>
    </p>
  </div>
</div>
</body>
</html>
