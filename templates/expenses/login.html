{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — ExpenseIQ</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <style>
    body { background: #f1f5f9; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: #fff; border-radius: 20px; padding: 2.5rem 2rem; width: 100%; max-width: 400px; box-shadow: 0 8px 40px rgba(0,0,0,.10); }
    .login-logo { font-size: 2.5rem; color: #6366f1; }
    .btn-accent { background: #6366f1; color: #fff; border: none; border-radius: 10px; font-weight: 600; }
    .btn-accent:hover { background: #4f46e5; color: #fff; }
    .form-control:focus { border-color: #6366f1; box-shadow: 0 0 0 3px rgba(99,102,241,.15); }
    .hint-box { background: #f8fafc; border-radius: 10px; padding: .75rem 1rem; font-size: .82rem; color: #64748b; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-4">
      <div class="login-logo"><i class="bi bi-wallet2"></i></div>
      <h4 class="fw-bold mt-2 mb-0">ExpenseIQ</h4>
      <p class="text-muted small">Flat Expense Manager</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 small"><i class="bi bi-exclamation-circle me-1"></i>{{ error }}</div>
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label fw-semibold small">Username</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-person"></i></span>
          <input type="text" name="username" class="form-control" placeholder="e.g. krishnaveni" autofocus required/>
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Password</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" name="password" class="form-control" placeholder="••••••••" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-accent w-100 py-2">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </button>
    </form>

    <div class="hint-box mt-4">
      <strong>Default credentials:</strong><br>
      👑 krishnaveni / krishna123<br>
      🙋 ananya / ananya123<br>
      🙋 aiswarya / aiswarya123
    </div>
  </div>
</body>
</html>
